<mat-toolbar #toolbar [ngClass]="isSmallScreen?'fx-column-gap-half':'fx-column-gap-1'"
	class="fixed-top semi-transparent toolbar-custom">
	<main-buttons></main-buttons>

	@if (convertZHButtonEnabled) {
	<button mat-mini-fab color="any" matSuffix (click)="toogleChineseST()"
		aria-label="toggle between Chinese simplified and traditional">
		<mat-icon svgIcon="{{jianFanIcon}}"></mat-icon>
	</button>
	}

	@if (!isStaticReadonly && !updateAvailable) {
	<button mat-mini-fab color="any" type="button" (click)="reload()" aria-label="refresh" matTooltip="Reload data">
		<mat-icon>refresh</mat-icon>
	</button>
	}
	<span class="toolbar-spacer"></span>
	<button type="button" mat-mini-fab color="any" (click)="showViewSettings()" aria-label="settings">
		<mat-icon>settings</mat-icon>
	</button>
	<button mat-mini-fab color="any" type="button" (click)="toggleSidenav()" aria-label="toggle sidebar">
		<mat-icon>reorder</mat-icon>
	</button>
</mat-toolbar>
<div>
	<chronicle-for-reader #chronicle [poemBriefs]="poemBriefs" [tagIdSignal]="tagIdSignal" [poemsLoadedSignal]="poemsLoadedSignal"></chronicle-for-reader>
</div>
