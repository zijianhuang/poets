<div class="fixed-top">
	<mat-toolbar #toolbar [ngClass]="isSmallScreen?'fx-column-gap-half':'fx-column-gap-1'">
		<main-buttons></main-buttons>

		<span class="toolbar-spacer"></span>
		<button mat-mini-fab color="any" type="button" (click)="toggleSidenav()" aria-label="toggle sidebar">
			<mat-icon>reorder</mat-icon>
		</button>
	</mat-toolbar>
</div>
<div>
	<mat-sidenav-container hasBackdrop="false" scrollable="">
		<mat-sidenav #sidenav mode="over" opened class="fx-50pc-width" fixedInViewport="true" position="end"
			[fixedTopGap]="mainToolbarHeight" autoFocus="false">
			<div #sidenavContent>
				<mat-selection-list [multiple]="false" (selectionChange)="handleAlbumChange($event)">
					@for (a of albums; track a.id) {
					<mat-list-option #ca="matListOption" [value]="a">
						<span matListItemTitle>
							{{a.title}}
						</span>
						<span matListItemLine>
							&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{a.published | date:'yyyy-MM-dd'}}
						</span>
					</mat-list-option>
					}
				</mat-selection-list>
			</div>
		</mat-sidenav>
		<mat-sidenav-content fixedInViewport="true">
			@if (currentAlbum.id) {
			<album-meta-viewer [data]="currentAlbum" [showTitle]="true"></album-meta-viewer>
			}
			<p></p>
			@for (p of poemsOfAlbum; track p.id) {
			<div>
				<poem-viewer #poemViewers [data]="p" [settings]="albumPoemViewerSettings"></poem-viewer>
				<p></p>
			</div>
			}
			<p></p>
			<!-- In read mode, this button is controled by siteConfig.js -->
			<div class="viewer-margin">
				@if (currentAlbum.id && copyAlbumEnabled) {
				<button mat-mini-fab color="any" (click)="copyToClipboard()" i18n-matTooltip
					matTooltip="Copy album to clipboard">
					<mat-icon>content_copy</mat-icon>
				</button>
				}
			</div>
			<p></p>
		</mat-sidenav-content>
	</mat-sidenav-container>
	<p></p>
</div>
