<div>
	<!--<div class="func-title">Search Users</div>-->
	<div>
		<form name="form" #f="ngForm" novalidate class="fx-layout-column">

			<mat-form-field class="width-15">
				<mat-label i18n>Search users</mat-label>
				<input matInput name="keyword" [(ngModel)]="model.keyword" #keyword="ngModel" />
			</mat-form-field>


			<div class="form-group">
				<button type="submit" [disabled]="loading" mat-raised-button (click)="search()" i18n>Search</button>
				<!--<button mat-raised-button (click)="clear()">Clear</button>-->
			</div>

		</form>
	</div>
</div>

<div>
	@if (hasUsers) {
<table class="table table-striped" style="width:37em">
		<colgroup>
			<col style="width:15em" />
			<col style="width:20em" />
			<col style="width:8em" />
		</colgroup>
		<thead class="thead-inverse">
			<tr>
				<th class="text-left" i18n>Username</th>
				<th class="text-left" i18n>Roles</th>
				<th></th>
				<th></th>
			</tr>
		</thead>

		<tbody>
			@for (u of users; track u.id) {
<tr>
				<td>{{ u.name }}</td>
				<td>{{ u.description }}</td>
				<td>
					<div class="fx-column-gap-1">
						<button mat-mini-fab color="any" (click)="update(u)">
							<mat-icon>edit</mat-icon>
						</button>
						<button mat-mini-fab color="any" (click)="delete(u)">
							<mat-icon>delete_forever</mat-icon>
						</button>
					</div>
				</td>
			</tr>
}
		</tbody>

		<tfoot>

		</tfoot>

	</table>
}
</div>
<p></p>
