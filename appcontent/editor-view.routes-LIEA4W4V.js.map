<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>External Pictures Management</span>
</h1>
<mat-dialog-content>
	@for (srcUrl of pictureURLs; track srcUrl) {
	<div>
		<not-local-image [srcUrl]="srcUrl" [poemIds]="urlToPicturesDic[srcUrl]" [poemBriefsDic]="poemBriefsDic"
			(imageHandled)="removeImageCard(srcUrl)"></not-local-image>
	</div>
	}
	@if (pictureURLs.length==0) {
	<div i18n>
		No external images in poems
	</div>
	}
</mat-dialog-content>
