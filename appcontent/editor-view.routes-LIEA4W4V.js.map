<div mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" (click)="close()">
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	@if (!readonly) {

		<button type="submit" mat-mini-fab color="primary" (click)="save()" [disabled]="!modified"
				i18n-matTooltip matTooltip="Save">
			<mat-icon>done</mat-icon>
		</button>
		<button mat-mini-fab color="any" (click)="reset()" [disabled]="!modified"
				i18n-matTooltip matTooltip="Undo changes">
			<mat-icon>undo</mat-icon>
		</button>
	
}
	<label>{{ noteLabel }}</label>
</div>
<mat-dialog-content>
	<div [formGroup]="albumForm" #albumFormSection>
		<!--<div>Likely HTML only in the future
			<mat-form-field>
				<mat-label i18n>Format</mat-label>
				<mat-select [formControl]="bodyTypeControl">
					<mat-option [value]=0>Text</mat-option>
					<mat-option [value]=1>HTML</mat-option>
					<mat-option [value]=2>Mark Down</mat-option>
				</mat-select>
			</mat-form-field>
		</div>-->
		<div class="top-margin-half">
			<mat-form-field class="fx-full-width">
				<mat-label i18n>Title</mat-label>
				<input matInput formControlName="title" maxlength="128">
			</mat-form-field>
		</div>

		<div>
			<html-editor-menu [bodyControl]="noteControl" [htmlEditor]="htmlEditor" [isHtml]="bodyTypeControl.value==1"></html-editor-menu>
			<p></p>
		</div>
		@if (bodyTypeControl.value==1) {
<angular-editor id="htmlEditor" #htmlEditor [formControl]="noteControl" [config]="config">
		</angular-editor>
}
		@if (bodyTypeControl.value==0) {
<mat-form-field id="textEditor" class="fx-full-width">
			<mat-label>{{noteLabel}}</mat-label>
			<textarea matInput #textDetail name="note" [formControl]="noteControl"
					  cdkTextareaAutosize cdkAutosizeMinRows="8" [cdkAutosizeMaxRows]="maxRows"
					  [readonly]="readonly"></textarea>
		</mat-form-field>
}
		<p></p>
		<div>
			<mat-form-field class="fx-full-width">
				<mat-label i18n>First published URL</mat-label>
				<input matInput type="url" formControlName="publishedUrl" maxlength="256" spellcheck="false">
			</mat-form-field>
		</div>

		<mat-form-field>
			<mat-label i18n>Publish Date</mat-label>
			<input matInput formControlName="published" [matDatepicker]="publishedPicker" [max]="maxPublishedDate">
			<mat-datepicker-toggle matSuffix [for]="publishedPicker"></mat-datepicker-toggle>
			<mat-datepicker #publishedPicker [startView]="publishedStartView" [startAt]="defaultPublished"></mat-datepicker>
		</mat-form-field>
	</div>
</mat-dialog-content>
