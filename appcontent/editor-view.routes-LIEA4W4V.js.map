<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>User</span>
</h1>
<mat-dialog-content>
	<div class="func-title">User</div>
	<div>
		<form name="form" class="basic-width fx-layout-column" [formGroup]="modelForm">
			<div>
				<mat-form-field class="width-20">
					<mat-label i18n>Username</mat-label>
					<input matInput name="username" formControlName="userName" readonly="readonly" />
				</mat-form-field>
			</div>
			<div>
				<mat-form-field class="width-20">
					<mat-label i18n>Full Name</mat-label>
					<input matInput name="fullName" formControlName="fullName" spellcheck="false" />
				</mat-form-field>
			</div>
			<div>
				<mat-form-field class="width-20">
					<mat-label i18n>Email</mat-label>
					<input type="email" matInput name="email" formControlName="email" spellcheck="false" />
				</mat-form-field>
			</div>
			<div class="fx-column-gap-half">
				<button type="submit" mat-raised-button (click)="save()" [disabled]="!modelForm.dirty"
					i18n>Save</button>
				<button mat-raised-button (click)="changePassword()" i18n>Change Password</button>
				<button mat-raised-button (click)="delete()" i18n>Delete</button>
			</div>
		</form>
	</div>

	@if (model) {
	<div>
		<account-roles [roles]="model.roles" [userId]="userId"></account-roles>
	</div>
	}
	<p></p>


</mat-dialog-content>
