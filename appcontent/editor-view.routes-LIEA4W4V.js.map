<mat-toolbar [ngClass]="isSmallScreen?'fx-column-gap-half':'fx-column-gap-1'"
	class="fixed-top semi-transparent toolbar-custom">
	<main-buttons></main-buttons>

	<button mat-mini-fab color="any" (click)="addPoem()" i18n-matTooltip matTooltip="Add poem">
		<mat-icon>add</mat-icon>
	</button>

	@if (chronicleForEditor?.currentPoem?.id) {
	<div [ngClass]="isSmallScreen?'fx-column-gap-half':'fx-column-gap-1'">
		<button mat-mini-fab color="any" (click)="editCurrentPoem()">
			<mat-icon>edit</mat-icon>
		</button>
		<button mat-mini-fab color="any" (click)="deleteCurrentPoem()">
			<mat-icon>delete</mat-icon>
		</button>
	</div>
	}

	<span class="toolbar-spacer"></span>

	<mat-menu #authorMenu="matMenu" [overlapTrigger]="false">
		<button mat-menu-item type="button" (click)="showSettings()">
			<mat-icon>settings</mat-icon>
			<span i18n>Settings</span>
		</button>
		@if (useAnnotations) {
		<button mat-menu-item type="button" (click)="showSettingsAnnotations()">
			<mat-icon>tips_and_updates</mat-icon>
			<span i18n>Annotations</span>

		</button>
		}
		@if (useTags) {
		<button mat-menu-item type="button" (click)="showSettingsTags()">
			<mat-icon>tag</mat-icon>
			<span i18n>Tags</span>
		</button>
		}
		<button mat-menu-item type="button" (click)="showSettingsPictures()">
			<mat-icon>photo_library</mat-icon>
			<span i18n>Pictures</span>
		</button>
		<button mat-menu-item type="button" (click)="showSettingsExternalPictures()">
			<mat-icon>video_camera_back</mat-icon>
			<span i18n>External Pictures</span>
		</button>
		@if (useAlbums && chronicleForEditor && hasAlbums) {
		<button mat-menu-item type="button" (click)="defineCurrentAlbum()" i18n-matTooltip
			matTooltip="Select album and then select poems to add to album">
			<mat-icon>library_books</mat-icon>
			<span>{{chronicleForEditor.selectAlbumLabel}}</span>
		</button>
		}
		<button mat-menu-item type="button" (click)="showUsers()">
			<mat-icon>group</mat-icon>
			<span i18n>Users</span>
		</button>
		<mat-divider></mat-divider>
		<button mat-menu-item [matMenuTriggerFor]="export">
			<mat-icon>download</mat-icon>
			<span i18n>Export</span>
		</button>
		<button mat-menu-item [matMenuTriggerFor]="importActions">
			<mat-icon>upload</mat-icon>
			<span i18n>Import for DB Update</span>
		</button>
		<mat-divider></mat-divider>
		<button mat-menu-item type="button" (click)="help()">
			<mat-icon>help</mat-icon>
			<span i18n>Help</span>
		</button>
		<button mat-menu-item type="button" (click)="showAbout()">
			<mat-icon>info</mat-icon>
			<span i18n>About</span>
		</button>
		<!--<mat-divider></mat-divider> Just for maintenance during development, the job should be done by the frontend.
		<button mat-menu-item type="button" (click)="updatePlainText()">
			Update Plain Text
		</button>-->

	</mat-menu>

	<mat-menu #export="matMenu">
		@if (usePublished) {
		<button mat-menu-item type="button" (click)="saveCollectionPublished()" i18n-matTooltip
			matTooltip="Save Poem Data published into JSON except images" i18n>
			Export All Published
		</button>
		}
		@if (isChinese) {
		<button mat-menu-item type="button" (click)="saveCollectionSOrT()" i18n>
			{{menuTextOfExport2nd}}
		</button>
		}
		<button mat-menu-item type="button" (click)="saveCollection()" i18n-matTooltip
			matTooltip="Save All Poem Data into JSON except images" i18n>
			Export All
		</button>
		<button mat-menu-item type="button" (click)="downloadImages()" i18n-matTooltip
			matTooltip="Download all images in zip" i18n>
			Export All Images
		</button>
	</mat-menu>

	<mat-menu #importActions="matMenu">
		<button mat-menu-item type="button" (click)="import()" i18n-matTooltip matTooltip="Import JSON file" i18n>
			Import JSON File
		</button>
		<button mat-menu-item type="button" (click)="importZip()" i18n-matTooltip
			matTooltip="Import Zip file with exported images" i18n>
			Import Zip File
		</button>
		<button mat-menu-item type="button" (click)="clearDatabase()" i18n-matTooltip
			matTooltip="Clear all contents and settings" i18n>
			Clear Database
		</button>

	</mat-menu>

	<button mat-mini-fab color="any" type="button" (click)="reload()">
		<mat-icon>refresh</mat-icon>
	</button>

	@if (useAlbums && chronicleForEditor?.currentAlbum) {
	<button mat-mini-fab color="any" (click)="defineCurrentAlbum()" i18n-matTooltip matTooltip="Quit composing album">
		<mat-icon>deselect</mat-icon>
	</button>
	}
	<!--<mat-checkbox [(ngModel)]="groupedByYearMonth">Grouped by Year/Month</mat-checkbox>-->


	<button type="button" mat-mini-fab color="any" [matMenuTriggerFor]="authorMenu">
		<mat-icon>apps</mat-icon>
	</button>

	<button mat-mini-fab color="any" type="button" (click)="toggleSidenav()">
		<mat-icon>reorder</mat-icon>
	</button>
</mat-toolbar>
<div>
	<chronicle-for-editor #chronicle [poemBriefs]="poemBriefs" [tagIdSignal]="tagIdSignal" [poemsLoadedSignal]="poemsLoadedSignal"></chronicle-for-editor>
</div>
