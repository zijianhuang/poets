<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" (click)="close()">
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	@if (!readonly) {

		<button type="submit" mat-mini-fab color="any" (click)="save()" [disabled]="!modified"
				i18n-matTooltip matTooltip="Save">
			<mat-icon>done</mat-icon>
		</button>
		<button mat-mini-fab color="any" (click)="reset()" [disabled]="!modified"
				i18n-matTooltip matTooltip="Undo changes">
			<mat-icon>undo</mat-icon>
		</button>
	
}
	<label>{{ noteLabel }}</label>
</h1>
<mat-dialog-content>
	<div [formGroup]="numberedAnnotationForm" #numberedAnnotationFormSection>
		<!--<mat-form-field class="fx-full-width">
			<input matInput placeholder="Number" formControlName="orderNumber" readonly>
		</mat-form-field>-->

		<html-editor-menu [bodyControl]="noteControl" [htmlEditor]="htmlEditor" [isHtml]="true"></html-editor-menu>
		<angular-editor id="htmlEditor" #htmlEditor [formControl]="noteControl" [config]="config">
		</angular-editor>

		<mat-form-field class="fx-full-width">
			<mat-label i18n>Reference URL</mat-label>
			<input matInput type="url" formControlName="url" maxlength="256" spellcheck="false">
		</mat-form-field>
	</div>
</mat-dialog-content>
