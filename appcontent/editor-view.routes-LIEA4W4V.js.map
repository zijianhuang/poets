<mat-card appearance="outlined">
	<mat-card-header>
		<mat-card-title-group>
			<img mat-card-md-image [attr.src]="srcUrl!" loading="lazy" decoding="async" />
		</mat-card-title-group>
	</mat-card-header>

	<mat-card-content>
		<mat-chip-set aria-label="Poems">
			@for (pId of poemIds; track pId) {
			<mat-chip (click)="editPoem(pId)">
				{{poemBriefsDic![pId].title}}
			</mat-chip>
			}
		</mat-chip-set>
		<mat-form-field class="fx-full-width margin-top-half">
			<mat-label i18n>Description</mat-label>
			<input matInput [(ngModel)]="description" maxlength="512">
		</mat-form-field>
	</mat-card-content>
	<mat-card-actions>
		<button mat-raised-button (click)="makeLocalImage(srcUrl!)" i18n>Remote to Local</button>
	</mat-card-actions>
</mat-card>
<br />
