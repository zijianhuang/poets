<h1 mat-dialog-title>
	{{ title }}
</h1>
<mat-dialog-content>
	<mat-selection-list #itemsSelection [multiple]="data.multiple" (selectionChange)="itemSelectionChange($event)">
		@for (p of items; track p.id) {
<mat-list-option [value]="p">
			{{toString(p)}}
		</mat-list-option>
}

	</mat-selection-list>
</mat-dialog-content>
<mat-dialog-actions [align]="actionsAlign">
	<button type="reset" mat-raised-button matDialogClose>Cancel</button>
	@if (data.multiple) {
<button type="submit" mat-raised-button (click)="confirm()" [disabled]="!anySelected">Confirm</button>
}
	@if (data.multiple) {
<button type="button" mat-raised-button (click)="confirmAll()" [disabled]="itemsSelection?.options?.length==0">All</button>
}
</mat-dialog-actions>
