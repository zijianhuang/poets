<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>Users</span>
</h1>
<mat-dialog-content>
	<mat-tab-group>
		<mat-tab label="Register" matTooltip="Register new user">
			<ng-template matTabContent>
				<div class="top-margin-half">
					<account-register></account-register>
				</div>
			</ng-template>
		</mat-tab>

		<mat-tab label="Users" matTooltip="Register new user">
			<ng-template matTabContent>
				<div class="top-margin-half">
					<account-users></account-users>
				</div>
			</ng-template>
		</mat-tab>
	</mat-tab-group>
</mat-dialog-content>
