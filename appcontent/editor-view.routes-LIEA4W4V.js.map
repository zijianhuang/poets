<div class="fx-layout-column">
	<p></p>
	<mat-checkbox [formControl]="usePublishedControl" i18n>Use Published Date</mat-checkbox>
	<mat-checkbox [formControl]="useRyhmesControl" i18n>Use Ryhmes</mat-checkbox>
	<mat-checkbox [formControl]="useFirstPublishUrlControl" i18n>Use First Publish URL</mat-checkbox>
	<mat-checkbox [formControl]="useAnnotationsControl" i18n>Use Annotations</mat-checkbox>
	<mat-checkbox [formControl]="useNumberedAnnotationsControl" i18n>Use Numeric Citation</mat-checkbox>
	<mat-checkbox [formControl]="useTagsControl" i18n>Use Tags</mat-checkbox>
	<mat-checkbox [formControl]="useAlbumsControl" i18n>Use Albums</mat-checkbox>
	<mat-checkbox [formControl]="useNumberOfStanzaControl" i18n>Use Number of Stanza</mat-checkbox>
	@if (useNumberOfStanzaControl.value) {
<div i18n>Total Count of Stanza: {{totalCountOfStanza}}</div>
}
	<p></p>
	<mat-divider></mat-divider>
	<p></p>
	<mat-checkbox [formControl]="useYearFirstInPublishedControl" i18n>Pick Year First in Published Date</mat-checkbox>
	<!-- <mat-checkbox [formControl]="advancedClipboardEnabledControl">Enable Advanced Clipboard Functions</mat-checkbox> always true now-->
	<p></p>

</div>
