<div class="fx-layout-column" #authorSection>
	<p></p>
	<mat-form-field class="width-30">
		<mat-label i18n>Author</mat-label>
		<input matInput [formControl]="authorNameControl" maxlength="128">
		<button matSuffix (click)="saveSetting('settings.authorName', authorNameControl)" mat-icon-button [disabled]="!authorNameControl.dirty">
			<mat-icon>save</mat-icon>
		</button>
	</mat-form-field>
	<mat-form-field class="width-30">
		<mat-label i18n>Pen Name</mat-label>
		<input matInput [formControl]="pennameControl" maxlength="128">
		<button matSuffix (click)="saveSetting('settings.penname', pennameControl)" mat-icon-button [disabled]="!pennameControl.dirty">
			<mat-icon>save</mat-icon>
		</button>
	</mat-form-field>
	<mat-form-field class="fx-full-width">
		<mat-label i18n>Bio</mat-label>
		<textarea matInput [formControl]="bioControl" i18n-placeholder placeholder="Short bio about the author..."
				  cdkTextareaAutosize cdkAutosizeMinRows="3" cdkAutosizeMaxRows="20"></textarea>
	</mat-form-field>
	<button (click)="saveSetting('settings.bio', bioControl)" mat-mini-fab color="any" [disabled]="!bioControl.dirty">
		<mat-icon>save</mat-icon>
	</button>
	<p> </p>
</div>
