<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>Annotations Management</span>
</h1>
<mat-dialog-content>
	@if (orphansExist) {
<div>
		<button mat-raised-button (click)="showOrphanedAnnotations()" i18n>Find Orphaned Annotations and Delete</button>
	</div>
}
	<p> </p>
	<div class="top-margin-1">
		<mat-form-field>
			<mat-label i18n>Click-Chip Action</mat-label>
			<mat-select [(value)]="clickChipAction" i18n-matTooltip matTooltip="What action to take when clicking annotation chip">
				<mat-option [value]=1 i18n>Edit</mat-option>
				<mat-option [value]=2 i18n>List Poems</mat-option>
			</mat-select>
		</mat-form-field>
	</div>

	<div id="annotations" class="chip-list">
		<mat-label i18n>Annotations</mat-label>
		<mat-chip-listbox #annotationChipList aria-label="Annotations">
			@for (a of annotations; track a.id) {
<mat-chip-option [selectable]="false" (removed)="removeAnnotation(a.id)" (click)="clickChip(a.id)" matBadge="{{a.count}}" matBadgePosition="before">
				{{annotationsDic[a.id].name}}
				<button matChipRemove>
					<mat-icon>cancel</mat-icon>
				</button>
			</mat-chip-option>
}
		</mat-chip-listbox>
	</div>
</mat-dialog-content>
