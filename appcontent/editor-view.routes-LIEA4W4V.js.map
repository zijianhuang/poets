<div class="fixed-top">
	<mat-toolbar #toolbar [ngClass]="isSmallScreen?'fx-column-gap-half':'fx-column-gap-1'">
		<main-buttons></main-buttons>

		<span class="toolbar-spacer"></span>
		<button mat-mini-fab color="any" type="button" (click)="toggleSidenav()" aria-label="toggle sidebar">
			<mat-icon>reorder</mat-icon>
		</button>
	</mat-toolbar>
</div>
<mat-sidenav-container hasBackdrop="false">
	<mat-sidenav #sidenav mode="over" opened class="fx-50pc-width" fixedInViewport="true" position="end"
		[fixedTopGap]="mainToolbarHeight" autoFocus="false">
		<div #sidenavContent class="top-margin-half">
			<div class="fx-column-gap-1">
				&nbsp;&nbsp;&nbsp;&nbsp;
				<button mat-mini-fab color="any" (click)="editAlbum()" matTooltip="Edit selected album description"
					[disabled]="!this.currentAlbum.id">
					<mat-icon>edit</mat-icon>
				</button>
				<button mat-mini-fab color="any" (click)="addAlbum()" matTooltip="Add album">
					<mat-icon>add</mat-icon>
				</button>
				<button mat-mini-fab color="any" (click)="deleteAlbum()" matTooltip="Delete selected album"
					[disabled]="!this.currentAlbum.id">
					<mat-icon>delete</mat-icon>
				</button>
			</div>
			<mat-selection-list [multiple]="false" (selectionChange)="handleAlbumChange($event)">
				@for (a of albums; track a.id) {
				<mat-list-option #ca="matListOption" [value]="a">
					<span matListItemTitle>
						{{a.title}}
					</span>
					<span matListItemLine>
						&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{{a.published | date:'yyyy-MM-dd'}}
					</span>
				</mat-list-option>
				}
			</mat-selection-list>
		</div>
	</mat-sidenav>
	<mat-sidenav-content fixedInViewport="true">
		<div id="album-container">
			@if (currentAlbum.id) {
			<album-meta-viewer [data]="currentAlbum!" [showTitle]="true"></album-meta-viewer>
			}
			<p></p>
			@for (p of poemsOfAlbum; track p.id) {
			<div>
				<poem-viewer #poemViewers [data]="p" [settings]="albumPoemViewerSettings"></poem-viewer>
				<p></p>
			</div>
			}
		</div>

		<p></p>
		<!-- This button is always available in editor mode -->
		<div class="viewer-margin">
			@if (currentAlbum.id && !advancedClipboardEnabled) {
			<button mat-mini-fab color="any" (click)="copyToClipboard()" i18n-matTooltip
				matTooltip="Copy album to clipboard">
				<mat-icon>content_copy</mat-icon>
			</button>
			}
			@if (advancedClipboardEnabled) {

			<button mat-mini-fab color="any" [matMenuTriggerFor]="clipboardMenu">
				<mat-icon>content_copy</mat-icon>
			</button>
			<mat-menu #clipboardMenu="matMenu">
				<button mat-menu-item (click)="copyToClipboard()">Copy to Clipboard</button>
				<button mat-menu-item (click)="copyPlainTextToClipboard()">Copy as Plain Text</button>
				<button mat-menu-item (click)="copyHtmlTextToClipboardAsPlain()">Copy as HTML Tags</button>
			</mat-menu>

			}
		</div>
		<p></p>
	</mat-sidenav-content>
</mat-sidenav-container>
<p></p>
