<button  mat-mini-fab color="any" [matMenuTriggerFor]="editorMenu">
	<mat-icon>more_vert</mat-icon>
</button>
<mat-menu #editorMenu="matMenu">
	@if (isHtml) {
<button mat-menu-item (click)="pastFromClipboardAsPlainText()">
		<span i18n>Paste as Plain Text</span>
		<mat-icon>content_paste</mat-icon>
	</button>
}
	<button mat-menu-item (click)="replaceDoubleLineBreaks()" i18n>Replace Double Linebreaks with One</button>
</mat-menu>
