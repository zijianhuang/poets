	<!--<div class="func-title">Register</div>-->
<form name="form" (ngSubmit)="f.form.valid && register()" #f="ngForm" novalidate class="fx-layout-column">
	<mat-form-field class="width-25">
		<mat-label i18n>Username</mat-label>
		<input matInput name="username" [(ngModel)]="model.userName" #username="ngModel" required [readonly]="submitted"
			   i18n-matTooltip matTooltip="Alphanumeric; minimum length: 2" autocomplete="off" spellcheck="false" />
	</mat-form-field>
	<div>
		<mat-form-field class="width-25">
			<mat-label i18n>Password</mat-label>
			<input type="password" matInput name="password" [(ngModel)]="model.password" #password="ngModel"
				   required [readonly]="submitted" autocomplete="new-password" [type]="hide ? 'password' : 'text'" />
			<mat-icon matSuffix (click)="hide = !hide">{{ hide ? 'visibility' : 'visibility_off' }}</mat-icon>
			<mat-hint class="input-hint" i18n>Min. length: 6; digit, symbol, lowercase and uppercase</mat-hint>
		</mat-form-field>
	</div>

	<mat-form-field class="width-25">
		<mat-label i18n>Full Name</mat-label>
		<input type="text" matInput name="fullName" [(ngModel)]="model.fullName" #fullName="ngModel" [readonly]="submitted" />
	</mat-form-field>
	<mat-form-field class="width-25">
		<mat-label i18n>Email</mat-label>
		<input type="email" matInput name="email" [(ngModel)]="model.email" #email="ngModel" [readonly]="submitted" spellcheck="false" />
	</mat-form-field>

	<div class="fx-column-gap-half">
		<button type="submit" [disabled]="loading || !f.form.valid || submitted" mat-raised-button>Submit</button>
		<button type="reset" mat-raised-button (click)="clear()">{{ submitted?'Add Next User':'Clear' }}</button>
		<!--<button *ngIf="!submitted" mat-raised-button (click)="clear()" matTooltip="Clear fields">Clear</button>-->
	</div>

</form>

<!-- so to clear all the checkboxes in a simpliest way. -->
@if (submitted) {
<div>
	<label i18n>Check to assign roles to current user.</label>
	@if (userId) {
<account-roles [userId]="userId"></account-roles>
}
</div>
}
<p></p>
