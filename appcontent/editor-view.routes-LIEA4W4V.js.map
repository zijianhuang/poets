<h1 mat-dialog-title class="block-items-gap-1">
	<button mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>Tags Management</span>
</h1>
<mat-dialog-content>
	@if (orphansExist) {
<div>
		<button mat-raised-button (click)="showOrphanedTags()">Find Orphaned Tags and Delete</button>
	</div>
}
	<div id="tags" class="chip-list">
		<mat-label i18n>Tags</mat-label>
		<mat-chip-listbox #tagChipList aria-label="Tags">
			@for (a of tags; track a.id) {
<mat-chip-option [selectable]="false" (removed)="removeTag(a)" (click)="editTag(a.id!)"
							 matBadge="{{a.count?a.count:'O'}}" matBadgePosition="before" [matBadgeColor]="a.count?primaryColor: warnColor">
				{{tagsDic[a.id!].name}}
				<button matChipRemove>
					<mat-icon>cancel</mat-icon>
				</button>
			</mat-chip-option>
}
		</mat-chip-listbox>
	</div>
</mat-dialog-content>
