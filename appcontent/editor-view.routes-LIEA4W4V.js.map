<div>
	<p></p>
	<div class="fx-column-gap-half" [formGroup]="writtenLanguageGroup">
		<mat-form-field class="flex-14">
			<mat-label i18n>Written Language</mat-label>
			<input matInput formControlName="code" maxlength="10">
		</mat-form-field>
		<mat-form-field class="flex-14">
			<mat-label i18n>Display</mat-label>
			<input matInput formControlName="display" maxlength="32">
			<button matSuffix (click)="saveSettingGroup('settings.writtenLanguage', writtenLanguageGroup)" mat-icon-button [disabled]="!writtenLanguageGroup.dirty">
				<mat-icon>save</mat-icon>
			</button>
		</mat-form-field>
	</div>

	<div class="fx-column-gap-half" [formGroup]="defaultSpokenLanguageGroup">
		<mat-form-field class="flex-14">
			<mat-label i18n>Default Spoken Language Code</mat-label>
			<input matInput formControlName="code" maxlength="10">
		</mat-form-field>
		<mat-form-field class="flex-14">
			<mat-label i18n>Display</mat-label>
			<input matInput formControlName="display" maxlength="32">
			<button matSuffix (click)="saveSettingGroup('settings.defaultSpokenLanguage', defaultSpokenLanguageGroup)" mat-icon-button [disabled]="!defaultSpokenLanguageGroup.dirty">
				<mat-icon>save</mat-icon>
			</button>
		</mat-form-field>
	</div>

	<p></p>
	<strong i18n>Spoken Languages</strong>
	<div>
		<div class="fx-column-gap-1">
			<button mat-mini-fab color="any" (click)="addSpokenLanguage()">
				<mat-icon>add</mat-icon>
			</button>
			<button mat-mini-fab color="any" (click)="saveSettingArray('settings.spokenLangs', spokenLanguageFormArray)" [disabled]="!spokenLanguageFormArray.dirty">
				<mat-icon>save</mat-icon>
			</button>
		</div>

		<div>
			<p></p>
			@for (langFormGroup of spokenLanguageFormArray.controls; track langFormGroup; let i = $index) {
<div [formGroup]="getLangGroup(i)" class="fx-column-gap-half">
				<mat-form-field class="flex-14">
					<mat-label i18n>Spoken Language Code</mat-label>
					<input matInput formControlName="code" maxlength="10">
				</mat-form-field>
				<mat-form-field class="flex-14">
					<mat-label i18n>Display</mat-label>
					<input matInput formControlName="display" maxlength="32">
				</mat-form-field>
				<div>
					<button mat-mini-fab color="any" (click)="deleteSpokenLanguage(i)">
						<mat-icon>delete</mat-icon>
					</button>
				</div>

			</div>
}
		</div>
	</div>
	<p></p>
</div>
