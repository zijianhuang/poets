<h1 mat-dialog-title i18n>
	Update Meta
</h1>
<form name="form" (ngSubmit)="f.form.valid && saveMeta()" #f="ngForm" [formGroup]="metaGroup">
	<mat-dialog-content>
		<div class="fx-layout-column">
			<mat-form-field class="fx-full-width">
				<mat-label i18n>Name</mat-label>
				<input matInput formControlName="name" maxlength="128">
			</mat-form-field>
			<mat-form-field class="fx-full-width">
				<mat-label i18n>Description</mat-label>
				<input matInput formControlName="description" maxlength="512">
			</mat-form-field>
		</div>
	</mat-dialog-content>
	<mat-dialog-actions [align]="actionsAlign">
		<button type="reset" mat-raised-button matDialogClose i18n>Close</button>
		<button type="submit" mat-raised-button color="primary" [disabled]="!metaGroup.dirty" i18n>Save</button>
	</mat-dialog-actions>
</form>
