<h1 mat-dialog-title class="block-items-gap-1">
	<button  mat-mini-fab color="any" matTooltip="Back" mat-dialog-close>
		<mat-icon>arrow_back_ios</mat-icon>
	</button>
	<span i18n>Settings</span>
</h1>
<mat-dialog-content>
	<mat-tab-group>
		<mat-tab i18n-label label="Author">
			<ng-template matTabContent>
				<settings-author></settings-author>
			</ng-template>
		</mat-tab>
		<mat-tab i18n-label label="Poetry">
			<ng-template matTabContent>
				<settings-poetry></settings-poetry>
			</ng-template>
		</mat-tab>
		<mat-tab i18n-label label="Edit">
			<ng-template matTabContent>
				<settings-edit></settings-edit>
			</ng-template>
		</mat-tab>
		<mat-tab i18n-label label="View">
			<ng-template matTabContent>
				<view-settings [showTitle]="false"></view-settings>
			</ng-template>
		</mat-tab>
	</mat-tab-group>
</mat-dialog-content>
