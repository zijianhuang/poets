<div mat-dialog-title>
	<strong>{{ title }}</strong>
</div>
<mat-dialog-content>
	<p>{{ body }}</p>
	<!--<input id="uploadFile" name="uploadFile" type="file" (change)="fileChangeListener($event)"
		   [accept]="acceptFilter" matTooltip="Filtered for doc, Excel, PowerPoint, zip, image, video, audio" />-->
	<ngx-dropzone (change)="onFileSelect($event)" [multiple]="false" [accept]="acceptFilter">
		<ngx-dropzone-label>{{fileOperationHint}}</ngx-dropzone-label>
		@for (f of files; track f) {
		<ngx-dropzone-preview [removable]="true" (removed)="onFileRemove(f)">
			<ngx-dropzone-label>{{ f.name }} ({{ f.type }})</ngx-dropzone-label>
		</ngx-dropzone-preview>
		}
	</ngx-dropzone>
	@if (file) {
	<div>
		<p>MIME Type: {{ mimeType }}</p>
		<p>Size: {{ file.size | byteFormat }}</p>
		<mat-form-field class="fx-full-width">
			<mat-label i18n>Name</mat-label>
			<input matInput [(ngModel)]="name" maxlength="128" spellcheck="false">
		</mat-form-field>
		<mat-form-field class="fx-full-width">
			<mat-label i18n>Description</mat-label>
			<input matInput [(ngModel)]="description" maxlength="512">
		</mat-form-field>
		@if (fileSize && fileSize> 30000000) {
		<p>{{ getFileSizeWarning() }}</p>
		}
	</div>
	}
</mat-dialog-content>
<mat-dialog-actions [align]="actionsAlign">
	<button type="button" mat-raised-button matDialogClose>No</button>
	<button type="button" mat-raised-button (click)="confirm()" [disabled]="!file">Yes</button>
</mat-dialog-actions>
